<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Liga NBA 2K26 ELITE</title>

<style>
body{
    font-family: Arial;
    background:#0e0e0e;
    color:white;
    text-align:center;
}

input,button,select{
    padding:8px;
    margin:5px;
}

button{
    background:#007bff;
    border:none;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

table{
    margin:auto;
    margin-top:20px;
    border-collapse:collapse;
    width:85%;
}

th,td{
    border:1px solid #444;
    padding:8px;
}

th{
    background:#1a1a1a;
}

.card-container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:30px;
}

.card{
    background-size:cover;
    background-position:center;
    border-radius:15px;
    width:270px;
    height:440px;
    padding:15px;
    margin:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.9);
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
}

.card-overlay{
    background:rgba(0,0,0,0.75);
    padding:12px;
    border-radius:10px;
}

.green{ color:#00ff88; font-weight:bold;}
.red{ color:#ff4d4d; font-weight:bold;}
.yellow{ color:#ffd633; font-weight:bold;}

.prediction{
    margin-top:6px;
    font-size:13px;
    background:#111;
    padding:6px;
    border-radius:6px;
}
</style>
</head>
<body>

<h1>🏀 Liga NBA 2K26 ELITE</h1>

<h2>Agregar Jugador</h2>
<input type="text" id="playerName" placeholder="Nombre jugador">
<input type="text" id="playerImageUrl" placeholder="URL imagen (opcional)" style="width:300px;">
<button onclick="addPlayer()">Agregar</button>

<h2>Registrar Partido</h2>
<select id="player1"></select>
<input type="number" id="score1" placeholder="Pts">
vs
<select id="player2"></select>
<input type="number" id="score2" placeholder="Pts">
<button onclick="addMatch()">Guardar</button>

<h2>📊 Tabla de Posiciones</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>Jugador</th>
<th>W</th>
<th>L</th>
<th>Puntos</th>
<th>%</th>
<th>Diff Total</th>
</tr>
</thead>
<tbody id="standings"></tbody>
</table>

<h2> Jugadores </h2>
<div class="card-container" id="cards"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyB8oEVWDRvMF4J5CzCcs2-th4pa6za-hm8",
    authDomain: "liga-nba2k26.firebaseapp.com",
    databaseURL: "https://liga-nba2k26-default-rtdb.firebaseio.com",
    projectId: "liga-nba2k26",
    storageBucket: "liga-nba2k26.firebasestorage.app",
    messagingSenderId: "277332835931",
    appId: "1:277332835931:web:cdf080c6cc4fc312cc497e"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const playersRef = ref(database,"players");
const matchesRef = ref(database,"matches");

let players=[];
let matches=[];

onValue(playersRef,s=>{
    players=s.val()?Object.values(s.val()):[];
    updateUI();
});

onValue(matchesRef,s=>{
    matches=s.val()?Object.values(s.val()):[];
    updateUI();
});

window.addPlayer=function(){
    let name=document.getElementById("playerName").value.trim();
    let img=document.getElementById("playerImageUrl").value.trim();
    if(!name) return;

    const newRef=push(playersRef);
    set(newRef,{name,wins:0,losses:0,points:0,image:img});

    document.getElementById("playerName").value="";
    document.getElementById("playerImageUrl").value="";
}

window.addMatch=function(){

    let p1=document.getElementById("player1").value;
    let p2=document.getElementById("player2").value;
    let s1=parseInt(document.getElementById("score1").value);
    let s2=parseInt(document.getElementById("score2").value);

    if(!p1||!p2||p1===p2||isNaN(s1)||isNaN(s2)) return;

    const newMatch=push(matchesRef);
    set(newMatch,{p1,p2,s1,s2});

    players.forEach(p=>{
        if(p.name===p1){
            if(s1>s2){p.wins++;p.points+=3;}
            else p.losses++;
        }
        if(p.name===p2){
            if(s2>s1){p.wins++;p.points+=3;}
            else p.losses++;
        }
    });

    set(playersRef,players);
}

function updateUI(){

    let cards=document.getElementById("cards");
    let standings=document.getElementById("standings");
    let select1=document.getElementById("player1");
    let select2=document.getElementById("player2");

    cards.innerHTML="";
    standings.innerHTML="";
    select1.innerHTML="";
    select2.innerHTML="";

    players.forEach(p=>{
        select1.innerHTML+=`<option>${p.name}</option>`;
        select2.innerHTML+=`<option>${p.name}</option>`;
    });

    // Calcular diff total
    players.forEach(p=>{
        p.totalDiff=0;
        matches.forEach(m=>{
            if(m.p1===p.name){
                p.totalDiff += m.s1-m.s2;
            }
            if(m.p2===p.name){
                p.totalDiff += m.s2-m.s1;
            }
        });
    });

    // Ordenar ranking
    players.sort((a,b)=>{
        if(b.points!==a.points) return b.points-a.points;
        let aPct=a.wins/(a.wins+a.losses||1);
        let bPct=b.wins/(b.wins+b.losses||1);
        if(bPct!==aPct) return bPct-aPct;
        return b.totalDiff-a.totalDiff;
    });

    // Tabla posiciones
    players.forEach((p,index)=>{

        let total=p.wins+p.losses;
        let pct= total>0 ? ((p.wins/total)*100).toFixed(1) : 0;

        let icon="⚔️";
        if(index===0) icon="🥇";
        else if(index===1) icon="🥈";
        else if(index===2) icon="🥉";
        else if(index===players.length-1) icon="📉";
        else if(index<4) icon="🔥";

        standings.innerHTML+=`
        <tr>
            <td>${icon} ${index+1}</td>
            <td>${p.name}</td>
            <td>${p.wins}</td>
            <td>${p.losses}</td>
            <td>${p.points}</td>
            <td>${pct}%</td>
            <td>${p.totalDiff}</td>
        </tr>`;
    });

    // Cartas (se mantienen igual)
    players.forEach(p=>{

        let total=p.wins+p.losses;
        let winPercent= total>0 ? (p.wins/total) : 0;

        let vsStats={};

        matches.forEach(m=>{
            if(m.p1===p.name||m.p2===p.name){
                let rival=m.p1===p.name?m.p2:m.p1;
                if(!vsStats[rival]) vsStats[rival]={wins:0,losses:0,pointDiff:0};

                let isWin=(m.p1===p.name&&m.s1>m.s2)||(m.p2===p.name&&m.s2>m.s1);

                if(isWin){
                    vsStats[rival].wins++;
                    vsStats[rival].pointDiff+=Math.abs(m.s1-m.s2);
                }else{
                    vsStats[rival].losses++;
                    vsStats[rival].pointDiff-=Math.abs(m.s1-m.s2);
                }
            }
        });

        let vsHtml="";

        for(let rival in vsStats){

            let wins=vsStats[rival].wins;
            let losses=vsStats[rival].losses;
            let diff=vsStats[rival].pointDiff;
            let totalVs=wins+losses;
            let h2h= totalVs>0 ? (wins/totalVs) : 0;

            let prediction=((winPercent*0.5)+(h2h*0.5))*100;
            prediction=prediction.toFixed(1);

            let color="yellow";
            if(wins>losses) color="green";
            else if(wins<losses) color="red";

            vsHtml+=`
            <div>
                Vs ${rival}: 
                <span class="${color}">${wins} - ${losses}</span>
                (Diff: ${diff})
                <div class="prediction">
                    Probabilidad estimada: ${prediction}%
                </div>
            </div>`;
        }

        let bg=p.image?p.image:"https://via.placeholder.com/300x400";

        cards.innerHTML+=`
        <div class="card" style="background-image:url('${bg}')">
            <div class="card-overlay">
                <h3>${p.name}</h3>
                <div>Victorias: ${p.wins}</div>
                <div>Derrotas: ${p.losses}</div>
                <div>% Global: ${(winPercent*100).toFixed(1)}%</div>
                <hr>
                ${vsHtml||"Sin enfrentamientos"}
            </div>
        </div>`;
    });
}

</script>
</body>
</html>
